# Gradle
org.gradle.jvmargs=-Xmx3G

# Project
mod_version=1.3-1.21.1
maven_group=com.github.fanziyun
archives_base_name=363changelog
## 1.21.1 跑在 Java 21 上，更高版本的 class 文件游戏加载不了
java_version=21

# Common
minecraft_version=1.21.1
## NeoForge 21.1.x 只对应 1.21.1 这一个版本，范围就写死
minecraft_version_range=[1.21.1]
mod_id=changelog363
mod_name=363Changelog
mod_author=FanZiyun
mod_license=MIT
## common 子项目用 NeoForm 拿到"不带任何加载器的原版 Minecraft"
## https://projects.neoforged.net/neoforged/neoform
## 1.21.1 还是混淆版本，NeoForm 给出的是 Mojang 官方映射（mojmap）的反混淆结果，
## 所以 :fabric 也必须用同一套映射，否则两边的类名对不上，common 的源码没法共享
neo_form_version=1.21.1-20240808.144430
## Fabric 与 NeoForge 都内置 Fabric Mixin，所以 mixin 可以写在 common 里。
## 升级前先核对两边各自绑定的版本。
mixin_version=0.17.3+mixin.0.8.7
## 1.21.1 上平台无关的 cloth-config 制品是 intermediary 名字，
## common 编译期借用 mojmap 命名的 cloth-config-neoforge（见 common/build.gradle.kts）
cloth_config_version=15.0.140

# Fabric, see https://fabricmc.net/develop/
## 开发/编译用的 Loader 版本（取 0.16 末版即可）
fabric_loader_version=0.16.14
## fabric.mod.json 的 depends 下限：不得低于 runtime 前置（fabric-language-kotlin 要求 >=0.16.9）
fabric_loader_version_min=0.16.9
fabric_api_version=0.116.14+1.21.1
kotlin_loader_version=1.13.11+kotlin.2.3.21
modmenu_version=11.0.4

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
## 不用 21.1.244：它在 maven.neoforged.net 上缺 .pom（仓库端损坏），Gradle 解析不了
neoforge_version=21.1.243
neoforge_loader_version_range=[4,)
## Kotlin 语言提供者：NeoForge 侧玩家需要额外安装这个模组。
## 1.21.1 对应 KFF 5.x，6.x 是给 1.21.4+ 的
kotlin_for_forge_version=5.12.0
