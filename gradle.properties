# Gradle
org.gradle.jvmargs=-Xmx3G

# Project
mod_version=1.0-SNAPSHOT
maven_group=com.github.fanziyun
archives_base_name=changelog
java_version=25

# Common
minecraft_version=26.2
minecraft_version_range=[26.2, 26.3)
mod_id=changelog363
mod_name=363Changelog
mod_author=FanZiyun
mod_license=MIT
## common 子项目用 NeoForm 拿到"不带任何加载器的原版 Minecraft"
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2
## Fabric 与 NeoForge 都内置 Fabric Mixin，所以 mixin 可以写在 common 里。
## 升级前先核对两边各自绑定的版本。
mixin_version=0.17.3+mixin.0.8.7
## Cloth Config 有平台无关的 cloth-config 制品，common 可以直接编译期依赖它
cloth_config_version=26.2.155

# Fabric, see https://fabricmc.net/develop/
fabric_loader_version=0.19.3
fabric_api_version=0.155.2+26.2
kotlin_loader_version=1.13.13+kotlin.2.4.10
modmenu_version=20.0.1

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
## 26.2 系列目前只有 beta 构建（26.2.0.x-beta），NeoForge 尚未发布 26.2 正式版
neoforge_version=26.2.0.32-beta
neoforge_loader_version_range=[4,)
## Kotlin 语言提供者：NeoForge 侧玩家需要额外安装这个模组。
## 它在运行时提供 Kotlin 标准库，所以版本要跟着上面的 Kotlin 一起升：
## 6.2.0 带的是 2.3.10，和本项目编译用的 2.4.10 跨了一个 minor；6.3.0 带 2.4.0 才对得上
kotlin_for_forge_version=6.3.0
