# Gradle
org.gradle.jvmargs=-Xmx3G

# Project
mod_version=1.3
maven_group=com.github.fanziyun
archives_base_name=363changelog
java_version=25

# Common
minecraft_version=26.1.2
minecraft_version_range=[26.1.2, 26.2)
mod_id=changelog363
mod_name=363Changelog
mod_author=FanZiyun
mod_license=MIT
## common 子项目用 NeoForm 拿到"不带任何加载器的原版 Minecraft"
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1
## Fabric 与 NeoForge 都内置 Fabric Mixin，所以 mixin 可以写在 common 里。
## 升级前先核对两边各自绑定的版本。
mixin_version=0.17.3+mixin.0.8.7
## Cloth Config 有平台无关的 cloth-config 制品，common 可以直接编译期依赖它
cloth_config_version=26.1.154

# Fabric, see https://fabricmc.net/develop/
fabric_loader_version=0.18.6
fabric_api_version=0.150.0+26.1.2
kotlin_loader_version=1.13.11+kotlin.2.3.21
modmenu_version=18.0.0-beta.1

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.1.2.87
neoforge_loader_version_range=[4,)
## Kotlin 语言提供者：NeoForge 侧玩家需要额外安装这个模组
kotlin_for_forge_version=6.2.0
