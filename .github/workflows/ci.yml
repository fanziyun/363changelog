name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mod:
    name: Mod tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew build --stacktrace

  editor:
    name: Changelog editor build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: changelog-editor
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: changelog-editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
