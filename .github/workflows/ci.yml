name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew :1.21-fabric:test :26.1.2-fabric:test --stacktrace

  matrix:
    name: ${{ matrix.mc }} / ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc:
          - "1.21"
          - "1.21.1"
          - "1.21.2"
          - "1.21.3"
          - "1.21.4"
          - "1.21.5"
          - "1.21.6"
          - "1.21.7"
          - "1.21.8"
          - "1.21.9"
          - "1.21.10"
          - "1.21.11"
          - "26.1.2"
        loader:
          - fabric
          - neoforge
    env:
      GRADLE_OPTS: -Xmx2G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.mc }} / ${{ matrix.loader }}
        run: ./gradlew :${{ matrix.mc }}-${{ matrix.loader }}:buildAndCollect --stacktrace

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Client smoke test
        run: xvfb-run -a ./gradlew :${{ matrix.mc }}-${{ matrix.loader }}:smokeClient --stacktrace

      - name: Require smoke marker
        run: |
          grep -R "CHANGELOG363_SMOKE_OK" \
            "versions/${{ matrix.mc }}-${{ matrix.loader }}/runs/smoke/logs" \
            --include="*.log"

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: 363changelog-${{ matrix.mc }}-${{ matrix.loader }}
          path: |
            build/dist/${{ matrix.mc }}/${{ matrix.loader }}/*.jar
            !build/dist/${{ matrix.mc }}/${{ matrix.loader }}/*-sources.jar
          if-no-files-found: error

      - name: Upload smoke diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics-${{ matrix.mc }}-${{ matrix.loader }}
          path: |
            versions/${{ matrix.mc }}-${{ matrix.loader }}/runs/smoke/logs/
            versions/${{ matrix.mc }}-${{ matrix.loader }}/runs/smoke/crash-reports/
            versions/${{ matrix.mc }}-${{ matrix.loader }}/runs/smoke/screenshots/
            versions/${{ matrix.mc }}-${{ matrix.loader }}/hs_err_pid*.log
          if-no-files-found: ignore

  editor:
    name: Changelog editor build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: changelog-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: changelog-editor/package-lock.json
      - run: npm ci
      - run: npm run build
