# @Mod 类是普通 Kotlin class（构造函数收 ModContainer），用默认的 javafml 就够了；
# Kotlin for Forge 在这里只作为依赖存在，负责把 Kotlin 标准库带到运行时。
modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/fanziyun/363changelog/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
logoFile = "assets/${mod_id}/icon.png"
description = '''
更新日志模组 - 在标题界面与暂停界面展示整合包更新日志
'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
# 这里要的是 NeoForge 自身的版本，不是上面 loaderVersion 那个 FML 加载器版本
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "kotlinforforge"
type = "required"
versionRange = "[6,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "cloth_config"
type = "required"
# n
versionRange = "[${cloth_config_version},)"
ordering = "AFTER"
side = "CLIENT"
